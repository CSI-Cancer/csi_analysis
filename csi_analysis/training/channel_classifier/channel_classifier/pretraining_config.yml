method: bayes

metric:
  name: epoch_loss
  goal: minimize

parameters:
  epochs:
    value: 200
  
  embedding_dim:
    values: [32, 64, 128]
  
  batch_size:
    values: [256, 512, 1024]
  
  learning_rate:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-3
  
  margin:
    distribution: uniform
    min: 0.5
    max: 2.0
  
  weight_decay:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-4
  
  scheduler:
    values: ['reduce_on_plateau', 'cosine']
  
  scheduler_params:
    parameters:
      patience:
        values: [3, 5, 7]
      factor:
        values: [0.1, 0.5]
      min_lr:
        value: 1e-7
  
  optimizer:
    values: ['adam', 'adamw']
  
  dropout:
    distribution: uniform
    min: 0.1
    max: 0.5
  
  warmup_epochs:
    values: [0, 5, 10]
  
  early_stopping_patience:
    value: 15
  
  model:
    value: generic
  
  device:
    value: cuda:0 
  
  alpha:
    values: [0.25, 0.5, 1.0]
  gamma:
    values: [1.0, 2.0, 3.0]
  
    temperature:
    values: [0.05, 0.07, 0.1]
  
  # Loss weighting parameters
  lambda_triplet:
    distribution: uniform
    min: 0.3
    max: 0.7
  lambda_infonce:
    distribution: uniform
    min: 0.3
    max: 0.7